name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The services import the generated Prisma client, so it has to exist
      # before anything is typechecked or run. No database is involved.
      - run: pnpm --filter api generate

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # Catches anything that typechecks but will not bundle.
      - run: pnpm --filter web build
